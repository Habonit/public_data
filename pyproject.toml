[project]
name = "daegu-public-data-viz"
version = "1.2.1"
description = "대구 공공데이터 시각화 앱 - Streamlit 기반 대화형 데이터 분석 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.17.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.15.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.5",
    "anthropic>=0.39.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.6.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: 외부 API 호출이 필요한 테스트 (실행 시 API Key 필요)",
    "slow: 실행 시간이 긴 테스트 (10초 이상)",
    "integration: 여러 모듈을 연결하는 통합 테스트",
    "e2e: End-to-End 사용자 시나리오 테스트",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
